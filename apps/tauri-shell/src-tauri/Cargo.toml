[package]
name = "fd-tauri-shell"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "flex-dir-spike-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fd-host.workspace = true
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 앱 → OS 끌기. 리눅스는 GTK3(drag_begin), 윈도는 OLE DoDragDrop, 맥은 NSDraggingSession (tech.md §2.4)
drag = "2.1"

[target.'cfg(target_os = "linux")'.dependencies]
# tauri 2 (wry) 와 같은 gtk-rs 0.18 계열이어야 trait 가 맞는다
gtk = "0.18"
