[workspace]
resolver = "3"
members = ["crates/fd-core", "crates/fd-viewmodel", "crates/fd-portable", "crates/fd-host", "apps/tauri-shell/src-tauri", "apps/slint-shell"]
default-members = ["crates/fd-core", "crates/fd-viewmodel", "crates/fd-portable", "crates/fd-host"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
fd-core = { path = "crates/fd-core" }
fd-viewmodel = { path = "crates/fd-viewmodel" }
fd-portable = { path = "crates/fd-portable" }
fd-host = { path = "crates/fd-host" }
unicode-normalization = "0.1"

[profile.release]
debug = "line-tables-only"
