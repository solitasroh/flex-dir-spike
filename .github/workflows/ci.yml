# flex-dir 스파이크 CI — 세 OS 빌드 + Linux 설치본(AppImage) 2개 + 브라이언 fd-check.sh 로 끝까지 돌려 보기.
# 판정은 대표님 기기에서 한다. 여기 숫자(가상 화면)는 "도는가"와 추세만 본다.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  core:
    name: core · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - name: test (fd-core · fd-viewmodel · fd-portable · fd-host)
        run: cargo test -p fd-core -p fd-viewmodel -p fd-portable -p fd-host
      - name: clippy
        run: cargo clippy -p fd-core -p fd-viewmodel -p fd-portable -p fd-host --all-targets -- -D warnings

  tauri-linux:
    name: A · Tauri · Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-linux
      - name: 시스템 패키지 (Tauri 2 Linux 전제)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev patchelf file
      - name: clippy · test
        run: |
          cargo clippy -p fd-tauri-shell --all-targets -- -D warnings
          cargo test -p fd-tauri-shell
      - name: AppImage
        working-directory: apps/tauri-shell
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage --ci
      - name: 모으기
        run: |
          mkdir -p dist
          cp target/release/bundle/appimage/*.AppImage dist/
          ls -la dist
          sha256sum dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-tauri
          path: dist/*.AppImage
          if-no-files-found: error

  slint-linux:
    name: B · Slint(Qt) · Linux AppImage
    runs-on: ubuntu-22.04
    env:
      QMAKE: /usr/lib/qt6/bin/qmake
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: slint-linux
      - name: 시스템 패키지 (Qt6)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-wayland libqt6svg6 libgl1-mesa-dev librsvg2-bin file desktop-file-utils libfontconfig1-dev libxkbcommon-dev
      - name: clippy · test (winit 기본 = 단위·헤드리스 시험)
        run: |
          cargo clippy -p fd-slint-shell --all-targets -- -D warnings
          cargo test -p fd-slint-shell
      - name: build (Qt 백엔드)
        run: cargo build --release -p fd-slint-shell --no-default-features --features qt
      - name: AppImage
        run: |
          sudo apt-get install -y libfuse2 || true
          bash apps/slint-shell/packaging/build-appimage.sh dist target/release/flex-dir-spike-slint
          ls -la dist
          sha256sum dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-slint
          path: dist/*.AppImage
          if-no-files-found: error

  e2e-linux:
    name: fd-check.sh 끝까지 (Xvfb) — 실패하면 Release 없음
    needs: [tauri-linux, slint-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: appimage-*
          path: ${{ runner.temp }}/apps
          merge-multiple: true
      - name: AppImage 를 다운로드 폴더로
        run: |
          mkdir -p ~/Downloads
          cp "${{ runner.temp }}"/apps/*.AppImage ~/Downloads/
          chmod +x ~/Downloads/*.AppImage
          ls -la ~/Downloads
      - name: fd-check.sh 해시 (브라이언 확인표 부록과 같아야 한다)
        run: cd qa && sha256sum -c SHA256SUMS
      - name: fd-check.sh gfx — 설치 전 (빈 서버라 실패가 정상, 기록만)
        run: |
          if bash qa/fd-check.sh gfx; then echo "gfx: 통과 (이미 다 있음)"; else echo "gfx: 실패 — 위 안내 한 줄 확인"; fi
      - name: 호스트 라이브러리 점검 — 설치 전 (없는 것 = 대표님 기기에 있어야 하는 것)
        run: |
          bash .github/scripts/appimage-deps.sh ~/Downloads/*.AppImage | tee host-libs-before.txt
          echo "없는 라이브러리 $(wc -l < host-libs-before.txt)개"
      - name: 실행 환경 (가상 화면 + 일반 데스크톱에 있는 그래픽·xcb 라이브러리)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libfuse2 x11-xserver-utils dbus-x11 \
            libgles2 libopengl0 libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libegl-mesa0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: 호스트 라이브러리 점검 — 설치 후 (하나라도 남으면 실패)
        run: |
          bash .github/scripts/appimage-deps.sh ~/Downloads/*.AppImage | tee host-libs-after.txt
          if [ -s host-libs-after.txt ]; then echo "::error::아직 없는 라이브러리가 있다"; exit 1; fi
      - name: fd-check.sh gfx — 설치 후 (통과해야 앱을 띄운다)
        run: bash qa/fd-check.sh gfx
      - name: prepare
        run: xvfb-run -a -s "-screen 0 1920x1080x24" bash qa/fd-check.sh prepare
      - name: perf A
        run: xvfb-run -a -s "-screen 0 1920x1080x24" bash qa/fd-check.sh perf A
      - name: perf B
        if: always()
        run: xvfb-run -a -s "-screen 0 1920x1080x24" bash qa/fd-check.sh perf B
      - name: 관문 — 종료 코드 0 · FirstItem 10줄 · 보기마다 프레임 100줄 이상 · 5칸
        if: always()
        run: |
          mkdir -p e2e-summary
          cp host-libs-before.txt e2e-summary/ || true
          bash .github/scripts/e2e-gate.sh e2e-summary/e2e-summary.md
      - name: judge (가상 화면 숫자 — 판정 아님)
        if: always()
        run: python3 -I qa/judge.py ~/fd-spike-test/out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-out
          path: ~/fd-spike-test/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-summary
          path: e2e-summary

  release:
    name: Release (e2e 관문 통과 후에만)
    needs: [e2e-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: spike-d1-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: appimage-*
          path: rel
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: e2e-summary
          path: summary
      - name: 파일 모으기 · 해시
        run: |
          (cd qa && sha256sum -c SHA256SUMS)
          cp qa/fd-check.sh rel/
          (cd rel && sha256sum *.AppImage fd-check.sh > SHA256SUMS && cat SHA256SUMS)
      - name: 릴리스 노트
        run: |
          {
            echo "flex-dir 스파이크 — 11/26(목) 리눅스 확인용 시험 앱 (버리는 코드, 제품 아님)"
            echo
            echo "- 시험 앱 A (Tauri 2): \`$(cd rel && ls *tauri*.AppImage)\`"
            echo "- 시험 앱 B (Slint · Qt 백엔드): \`$(cd rel && ls *slint*.AppImage)\`"
            echo "- \`fd-check.sh\` v2026-11-25.3 — sha256 \`$(sha256sum rel/fd-check.sh | cut -c1-8)…\` (브라이언 확인표 부록과 같다)"
            echo "- 커밋 ${GITHUB_SHA::7} · 빌드 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## CI 가상 화면에서 fd-check.sh 로 끝까지 돌린 결과"
            echo
            cat summary/e2e-summary.md
            echo
            echo "## 호스트에 있어야 하는 라이브러리 (CI 빈 서버 기준으로 없던 것)"
            echo
            echo '```'
            cat summary/host-libs-before.txt
            echo '```'
          } > notes.md
          cat notes.md
      - name: 게시 (같은 태그는 새 빌드로 바꾼다)
        run: |
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" rel/*.AppImage rel/fd-check.sh rel/SHA256SUMS \
            --prerelease --target "$GITHUB_SHA" --title "D1 리눅스 시험 앱 A·B" --notes-file notes.md

  shells-other-os:
    name: 시험 앱 빌드 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: shells
      - name: A · Tauri
        run: cargo build -p fd-tauri-shell
      - name: B · Slint (winit — Windows·macOS 끌어다 놓기 경로는 D4 에서 정한다)
        run: cargo build -p fd-slint-shell
