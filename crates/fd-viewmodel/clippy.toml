  { path = "std::fs::rename", reason = "저장소 접근은 효과로" },
  { path = "std::fs::copy", reason = "저장소 접근은 효과로" },
  { path = "std::fs::read", reason = "저장소 접근은 효과로" },
  { path = "std::fs::write", reason = "저장소 접근은 효과로" },
  { path = "std::process::Command::new", reason = "외부 실행은 Effect::Activate 로" },
